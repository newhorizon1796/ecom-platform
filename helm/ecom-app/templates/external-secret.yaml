{{- if .Values.mysql.useRDS }}
# staging/prod: pull RDS master credentials from Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: ecom-platform/rds-master
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ecom-platform/rds-master
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: ecom-platform/rds-master
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: ecom-platform/rds-master
        property: port
{{- else }}
# dev/qa: pull the in-cluster MySQL password from Secrets Manager too (same
# "no hardcoded secrets anywhere" rule applies regardless of which MySQL
# you're pointed at). DB_HOST is NOT part of this secret — it's just the
# in-cluster Service name, set directly in the backend Deployment's env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: ecom-platform/incluster-mysql
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ecom-platform/incluster-mysql
        property: password
{{- end }}
