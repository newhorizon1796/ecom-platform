apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
    {{- include "ecom-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  # maxSurge: 0 — replace pods one-at-a-time instead of surging an extra one
  # alongside the old pod during rollout. Dev/qa's ResourceQuota has no spare
  # headroom for old+new to coexist (found the hard way — quota rejected the
  # surge pod); this trades a few seconds of downtime for not needing 2x
  # capacity, a real tradeoff for tightly-constrained environments.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ecr-cred
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            {{- if .Values.mysql.useRDS }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PORT
            {{- else }}
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            {{- end }}
            - name: DB_NAME
              value: {{ .Values.mysql.databaseName }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
