# ClusterSecretStore — not namespaced, one per cluster, usable by
# ExternalSecret resources in any namespace. Auth: no accessKeyID/secretAccessKey
# specified, so the AWS SDK falls back to the EC2 instance metadata service
# and picks up the node's IAM instance profile (ecom-platform-k3s-node) —
# same pattern as the AWS Load Balancer Controller. No IRSA since this isn't EKS.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
