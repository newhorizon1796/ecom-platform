apiVersion: v1
kind: Namespace
metadata:
  name: qa
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qa-quota
  namespace: qa
spec:
  hard:
    requests.cpu: "200m"
    requests.memory: 256Mi
    limits.cpu: "400m"
    limits.memory: 384Mi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: qa-limits
  namespace: qa
spec:
  limits:
    - type: Container
      default:
        cpu: 150m
        memory: 192Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
