apiVersion: v1
kind: Namespace
metadata:
  name: qa
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qa-quota
  namespace: qa
spec:
  hard:
    # EP-3 fix: same rationale as dev — see k8s/base/namespaces/dev.yaml.
    requests.cpu: "250m"
    requests.memory: 400Mi
    limits.cpu: "700m"
    limits.memory: 768Mi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: qa-limits
  namespace: qa
spec:
  limits:
    - type: Container
      default:
        cpu: 150m
        memory: 192Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
