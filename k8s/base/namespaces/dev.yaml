apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    # EP-3 fix: raised to actually fit frontend+backend+in-cluster mysql
    # together (was sized before the workload's real resource requests
    # existed, never cross-checked afterward).
    requests.cpu: "250m"
    requests.memory: 400Mi
    limits.cpu: "700m"
    limits.memory: 768Mi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limits
  namespace: dev
spec:
  limits:
    - type: Container
      default:
        cpu: 150m
        memory: 192Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
