server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # In-cluster: routes to the backend Service by DNS name (set per-env via
    # Helm values). Local docker-compose overrides this via vite's dev proxy
    # instead (see vite.config.js) — this nginx.conf only matters for the
    # built container image.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
